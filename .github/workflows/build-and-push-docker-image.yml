name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      fetch_arguments:
        description: 'Arguments for fetch_cli.py (Dockerfile Stage 1)'
        required: false
        type: choice
        options:
          - '--recent --attachments'
          - '--remote --attachments'
        default: '--recent --attachments'
  push:
    branches:
      - main
    paths:
      - 'confluence-mdx/**'
  pull_request:
    branches:
      - main
    paths:
      - 'confluence-mdx/**'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine fetch arguments
        id: fetch-args
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          INPUT_FETCH_ARGUMENTS: ${{ inputs.fetch_arguments }}
        run: |
          set -o errexit -o nounset -o pipefail

          fetch_arguments='--recent --attachments'
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            fetch_arguments="${INPUT_FETCH_ARGUMENTS:---recent --attachments}"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null ||
              ! git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- \
                ':(glob)confluence-mdx/var/pages.*.yaml'; then
              fetch_arguments='--remote --attachments'
            fi
          fi

          echo "arguments=$fetch_arguments" >> "$GITHUB_OUTPUT"
          echo "Fetch arguments: $fetch_arguments"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup cache directory
        working-directory: ./confluence-mdx
        run: |
          set -o errexit -o nounset -o pipefail -o xtrace
          ./bin/setup-cache.sh docker

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_CREDENTIAL }}

      - name: Build Docker image
        working-directory: ./confluence-mdx
        run: |
          set -o errexit -o nounset -o pipefail -o xtrace
          docker compose --progress=plain build \
            --build-arg "FETCH_ARGS=${{ steps.fetch-args.outputs.arguments }}"

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        working-directory: ./confluence-mdx
        run: |
          set -o errexit -o nounset -o pipefail -o xtrace
          touch .env
          docker compose --progress=plain push

      - name: Clean up untagged images from Docker Hub
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: ./confluence-mdx
        env:
          DOCKERHUB_USERNAME: ${{ vars.CONTAINER_REGISTRY_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_CREDENTIAL }}
        run: python3 bin/dockerhub-cleanup.py
